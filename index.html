<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>biubiubiu 数据面板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #2563eb;
      --brand-soft: #eff6ff;
      --danger: #b91c1c;
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
    header { max-width: 1180px; margin: 0 auto; padding: 28px 18px 12px; display: flex; gap: 14px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 26px; letter-spacing: .2px; }
    .sub { color: var(--muted); margin-top: 4px; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input, button, select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fff; font: inherit; }
    button { cursor: pointer; background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }
    button.secondary { background: #fff; color: var(--text); border-color: var(--line); }
    main { max-width: 1180px; margin: 0 auto; padding: 12px 18px 40px; }
    .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
    .metric .label { color: var(--muted); font-size: 13px; }
    .metric .value { font-size: 28px; font-weight: 800; margin-top: 5px; }
    .grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 14px; margin-top: 14px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: middle; }
    th { color: var(--muted); font-weight: 700; background: #fafafa; }
    tr:hover td { background: #fbfdff; }
    .right { text-align: right; }
    .muted { color: var(--muted); }
    .status { margin-top: 12px; color: var(--muted); }
    .error { color: var(--danger); background: #fff5f5; border: 1px solid #fecaca; border-radius: 12px; padding: 10px 12px; margin: 12px 0; display: none; }
    .raw { margin-top: 14px; }
    pre { margin: 0; overflow: auto; max-height: 360px; padding: 12px; border-radius: 12px; background: #0f172a; color: #e5e7eb; font-size: 12px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 12px; }
    @media (max-width: 980px) { .cards { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { header { align-items: stretch; } .toolbar { width: 100%; } input { flex: 1; min-width: 0; } .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>biubiubiu 数据面板</h1>
      <div class="sub">GitHub Pages 静态面板，只读取本仓库 JSON，不经过 Render。</div>
    </div>
    <div class="toolbar">
      <input id="dateInput" type="date" />
      <button id="loadBtn">加载数据</button>
      <button id="monthBtn" class="secondary">本月汇总</button>
    </div>
  </header>
  <main>
    <div id="error" class="error"></div>
    <section class="cards">
      <div class="card metric"><div class="label">弹幕发送</div><div id="mDanmu" class="value">0</div></div>
      <div class="card metric"><div class="label">讨论发送</div><div id="mDiscussion" class="value">0</div></div>
      <div class="card metric"><div class="label">弹幕失败</div><div id="mDanmuFailed" class="value">0</div></div>
      <div class="card metric"><div class="label">讨论失败</div><div id="mDiscussionFailed" class="value">0</div></div>
      <div class="card metric"><div class="label">设备数</div><div id="mDevices" class="value">0</div></div>
    </section>
    <section class="grid">
      <div class="card">
        <h2>按微博昵称统计</h2>
        <div id="userTable"></div>
      </div>
      <div class="card">
        <h2>按设备统计</h2>
        <div id="deviceTable"></div>
      </div>
    </section>
    <section class="card raw">
      <h2>原始数据 <span id="sourcePill" class="pill">未加载</span></h2>
      <pre id="rawJson">{}</pre>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const num = v => Number.isFinite(Number(v)) ? Number(v) : 0;
    const fmt = v => String(Math.round(num(v))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    $('dateInput').value = `${yyyy}-${mm}-${dd}`;

    const COUNTER_KEYS = {
      danmuSentToday: ['danmuSentToday', 'danmuSent', 'danmu_sent', 'danmuSentCount'],
      discussionSentToday: ['discussionSentToday', 'discussionSent', 'discussion_sent', 'discussionSentCount'],
      danmuFailedToday: ['danmuFailedToday', 'danmuFailed', 'danmu_failed', 'danmuFailedCount'],
      discussionFailedToday: ['discussionFailedToday', 'discussionFailed', 'discussion_failed', 'discussionFailedCount'],
      danmuSkippedToday: ['danmuSkippedToday', 'danmuSkipped', 'danmu_skipped', 'danmuSkippedCount']
    };

    function pick(obj, keys) {
      if (!obj || typeof obj !== 'object') return 0;
      for (const k of keys) if (obj[k] != null) return num(obj[k]);
      return 0;
    }

    function getCounter(obj, name) { return pick(obj, COUNTER_KEYS[name] || [name]); }

    function candidatePathsForDate(date) {
      const [y, m, d] = date.split('-');
      return [
        `archive/counters/${y}/${m}/${date}.json`,
        `archive/counters/${date}.json`,
        `counters/${date}.json`,
        `data/${date}.json`,
        `latest.json`,
        `summary/latest.json`
      ];
    }

    function candidatePathsForMonth(date) {
      const [y, m] = date.split('-');
      const ym = `${y}-${m}`;
      return [
        `archive/summary/${y}/${ym}.json`,
        `archive/summary/${ym}.json`,
        `summary/${ym}.json`,
        `monthly/${ym}.json`,
        `summary/latest.json`,
        `latest.json`
      ];
    }

    async function fetchFirst(paths) {
      const errors = [];
      for (const path of paths) {
        try {
          const res = await fetch(path + `?t=${Date.now()}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`${res.status}`);
          return { json: await res.json(), path };
        } catch (err) {
          errors.push(`${path}: ${err.message || err}`);
        }
      }
      throw new Error(errors.join('；'));
    }

    async function resolveLatestIndex(json, path, mode) {
      if (!json || typeof json !== 'object') return { json, path };
      const target = mode === 'month'
        ? (json.latestSummaryPath || json.summaryPath)
        : (json.latestCounterPath || json.counterPath);
      if (!target || target === path) return { json, path };
      const res = await fetch(target + `?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`${target}: ${res.status}`);
      return { json: await res.json(), path: `${target}（由 ${path} 指向）` };
    }

    function flattenRecords(data) {
      const records = [];
      const push = (row, context = {}) => {
        if (!row || typeof row !== 'object') return;
        const merged = { ...context, ...row };
        if (Object.keys(COUNTER_KEYS).some(k => getCounter(merged, k) > 0) || merged.deviceId || merged.weiboNickname) records.push(merged);
      };
      const walk = (node, context = {}) => {
        if (!node) return;
        if (Array.isArray(node)) { node.forEach(x => walk(x, context)); return; }
        if (typeof node !== 'object') return;
        if (node.counters && Array.isArray(node.counters)) node.counters.forEach(x => push(x, context));
        if (node.devices && Array.isArray(node.devices)) node.devices.forEach(x => push(x, context));
        if (node.records && Array.isArray(node.records)) node.records.forEach(x => push(x, context));
        if (node.items && Array.isArray(node.items)) node.items.forEach(x => push(x, context));
        if (node.users && typeof node.users === 'object') {
          Object.entries(node.users).forEach(([name, val]) => {
            if (Array.isArray(val)) val.forEach(x => push(x, { ...context, weiboNickname: name }));
            else push(val, { ...context, weiboNickname: name });
          });
        }
        if (node.days && typeof node.days === 'object') {
          Object.entries(node.days).forEach(([date, val]) => walk(val, { ...context, date }));
        }
        push(node, context);
      };
      walk(data);
      const seen = new Set();
      return records.filter(row => {
        const key = JSON.stringify([row.date || '', row.deviceId || '', row.weiboNickname || '', getCounter(row, 'danmuSentToday'), getCounter(row, 'discussionSentToday'), getCounter(row, 'danmuFailedToday'), getCounter(row, 'discussionFailedToday')]);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function aggregate(records, keyGetter) {
      const map = new Map();
      for (const row of records) {
        const key = keyGetter(row) || '未填写';
        if (!map.has(key)) map.set(key, { key, danmu: 0, discussion: 0, danmuFailed: 0, discussionFailed: 0, skipped: 0, devices: new Set() });
        const item = map.get(key);
        item.danmu += getCounter(row, 'danmuSentToday');
        item.discussion += getCounter(row, 'discussionSentToday');
        item.danmuFailed += getCounter(row, 'danmuFailedToday');
        item.discussionFailed += getCounter(row, 'discussionFailedToday');
        item.skipped += getCounter(row, 'danmuSkippedToday');
        if (row.deviceId) item.devices.add(row.deviceId);
      }
      return [...map.values()].sort((a, b) => (b.danmu + b.discussion) - (a.danmu + a.discussion));
    }

    function renderTable(rows, titleKey) {
      if (!rows.length) return '<div class="muted">暂无数据</div>';
      return `<table><thead><tr><th>${titleKey}</th><th class="right">弹幕</th><th class="right">讨论</th><th class="right">失败</th><th class="right">设备</th></tr></thead><tbody>${rows.map(r => `<tr><td>${escapeHtml(r.key)}</td><td class="right">${fmt(r.danmu)}</td><td class="right">${fmt(r.discussion)}</td><td class="right">${fmt(r.danmuFailed + r.discussionFailed)}</td><td class="right">${fmt(r.devices.size || 0)}</td></tr>`).join('')}</tbody></table>`;
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"]/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[s]));
    }

    function render(data, path) {
      const records = flattenRecords(data);
      const totals = records.reduce((acc, row) => {
        acc.danmu += getCounter(row, 'danmuSentToday');
        acc.discussion += getCounter(row, 'discussionSentToday');
        acc.danmuFailed += getCounter(row, 'danmuFailedToday');
        acc.discussionFailed += getCounter(row, 'discussionFailedToday');
        if (row.deviceId) acc.devices.add(row.deviceId);
        return acc;
      }, { danmu: 0, discussion: 0, danmuFailed: 0, discussionFailed: 0, devices: new Set() });
      $('mDanmu').textContent = fmt(totals.danmu);
      $('mDiscussion').textContent = fmt(totals.discussion);
      $('mDanmuFailed').textContent = fmt(totals.danmuFailed);
      $('mDiscussionFailed').textContent = fmt(totals.discussionFailed);
      $('mDevices').textContent = fmt(totals.devices.size);
      $('userTable').innerHTML = renderTable(aggregate(records, row => row.weiboNickname || row.nickname || row.user || row.name), '微博昵称');
      $('deviceTable').innerHTML = renderTable(aggregate(records, row => row.deviceId), '设备');
      $('rawJson').textContent = JSON.stringify(data, null, 2);
      $('sourcePill').textContent = path;
      $('status').textContent = `读取 ${records.length} 条记录，更新时间：${new Date().toLocaleString()}`;
      $('error').style.display = 'none';
    }

    async function load(mode = 'day') {
      $('status').textContent = '正在加载……';
      $('error').style.display = 'none';
      const date = $('dateInput').value || `${yyyy}-${mm}-${dd}`;
      const paths = mode === 'month' ? candidatePathsForMonth(date) : candidatePathsForDate(date);
      try {
        const first = await fetchFirst(paths);
        const { json, path } = await resolveLatestIndex(first.json, first.path, mode);
        render(json, path);
      } catch (err) {
        $('error').style.display = 'block';
        $('error').textContent = '没有读取到数据文件。已尝试路径：' + (err.message || err);
        $('status').textContent = '请确认 Render 写入的 JSON 路径，必要时在 index.html 中调整 candidatePathsForDate / candidatePathsForMonth。';
      }
    }

    $('loadBtn').addEventListener('click', () => load('day'));
    $('monthBtn').addEventListener('click', () => load('month'));
    load('day');
  </script>
</body>
</html>
